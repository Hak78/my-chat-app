name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-pip \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libffi-dev \
          libssl-dev \
          openjdk-17-jdk \
          unzip \
          zip \
          autoconf \
          libtool \
          pkg-config

    - name: Install Buildozer and Cython
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade cython==0.29.36
        pip install --upgrade buildozer

    - name: Accept Android Licenses Automatically
      run: |
        # إنشاء المجلدات الخاصة بأندرويد والموافقة التلقائية على كافة التراخيص لتجنب التوقف
        ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        mkdir -p $ANDROID_HOME/licenses
        echo -e "\n8933bac163af42a8b9585d164c5290a0245fcffc" > $ANDROID_HOME/licenses/android-sdk-license
        echo -e "\n24333f8a43b681623c22e153b921199ece0f66d8" > $ANDROID_HOME/licenses/android-sdk-preview-license
        
        # طريقة بديلة لضمان قبول أي ترخيص مفقود
        mkdir -p /home/runner/.android
        echo "### License accepted" > /home/runner/.android/repositories.cfg

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: bin/*.apk
