name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    # 1. جلب الملفات المصدريّة للمشروع
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. إعداد إصدار جافا المستقر 11 الافتراضي لـ Buildozer
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    # 3. إعداد بايثون المستقر
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 4. تثبيت الحزم الأساسية للنظام وإجبار تثبيت نسخة Cython المتوافقة
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-11-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev libgdbm-dev libsqlite3-dev libbz2-dev libltdl-dev
        pip install --upgrade pip
        # استخدام إصدار دقيق ومستقر من Cython لحل مشاكل التجميع
        pip install "Cython<3.0.0" buildozer

    # 5. تفعيل التخزين المؤقت للـ Buildozer
    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    # 6. بناء حزمة التطبيق (APK)
    - name: Build with Buildozer
      run: |
        yes | buildozer android debug

    # 7. رفع ملف الـ APK الناتج كـ Artifact
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
