name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. جلب الملفات المصدريّة للمشروع
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. إعداد إصدار جافا المستقر 11
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    # 3. إعداد بايثون لتشغيل Buildozer
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 4. تثبيت الاعتمادات والأدوات المطلوبة للنظام
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-11-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev libgdbm-dev libsqlite3-dev libbz2-dev wget
        pip install --upgrade pip
        pip install Cython==0.29.33 buildozer

    # 5. حل مشكلة الـ sdkmanager عبر إعداد أدوات سطر الأوامر مسبقاً
    - name: Pre-setup Android SDK Command-line Tools
      run: |
        # إنشاء المسارات التي يتوقعها buildozer لـ SDK
        mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools
        cd ~/.buildozer/android/platform/android-sdk/cmdline-tools
        
        # تحميل أحدث نسخة مستقرة متوافقة من أدوات سطر أوامر أندرويد
        wget https://google.com -O cmdline-tools.zip
        unzip cmdline-tools.zip
        rm cmdline-tools.zip
        
        # تنظيم المسار الداخلي كما تتطلبه أدوات أندرويد
        mv cmdline-tools latest
        
        # قبول كافة التراخيص مسبقاً لضمان عدم توقف البناء
        yes | ./latest/bin/sdkmanager --sdk_root=/home/runner/.buildozer/android/platform/android-sdk --licenses

    # 6. بناء حزمة التطبيق (APK) باستخدام Buildozer
    - name: Build with Buildozer
      run: |
        yes | buildozer android debug

    # 7. رفع ملف الـ APK الناتج كـ Artifact لتحميله
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
