name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. جلب الملفات المصدريّة للمشروع
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. إعداد إصدار جافا المستقر 11
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    # 3. إعداد بايثون لتشغيل Buildozer
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 4. تثبيت الاعتمادات والأدوات المطلوبة للنظام
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-11-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev libgdbm-dev libsqlite3-dev libbz2-dev
        pip install --upgrade pip
        pip install Cython==0.29.33 buildozer

    # 5. استخدام الأداة الرسمية المعتمدة لتهيئة وتثبيت الـ Android SDK تلقائياً وحل مشكلة التراخيص
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    # 6. ربط مسار الـ SDK بالمجلد الذي يتوقعه تطبيق Buildozer لتفادي إعادة تحميله
    - name: Link Android SDK for Buildozer
      run: |
        mkdir -p ~/.buildozer/android/platform
        ln -s $ANDROID_HOME ~/.buildozer/android/platform/android-sdk

    # 7. بناء حزمة التطبيق (APK) باستخدام Buildozer
    - name: Build with Buildozer
      run: |
        yes | buildozer android debug

    # 8. رفع ملف الـ APK الناتج كـ Artifact لتحميله من المتصفح
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
