name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. جلب الملفات المصدريّة للمشروع
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. إعداد إصدار جافا المتوافق (تم تعديله إلى 11 لحل مشكلة sdkmanager)
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    # 3. إعداد بايثون لتشغيل Buildozer
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 4. تثبيت الاعتمادات والأدوات المطلوبة للنظام وبناء أندرويد
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-11-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev libgdbm-dev libsqlite3-dev libbz2-dev
        pip install --upgrade pip
        pip install Cython==0.29.33 buildozer

    # 5. بناء حزمة التطبيق (APK) باستخدام Buildozer
    - name: Build with Buildozer
      run: |
        # قبول التراخيص تلقائياً وتجاوز فحص الأدوات التقليدي
        yes | buildozer android debug

    # 6. رفع ملف الـ APK الناتج كـ Artifact لتحميله من صفحة الـ Actions
    - name: Upload APK Artifact
      uses: actions/artifacts@v4
      with:
        name: android-apk
        path: bin/*.apk
